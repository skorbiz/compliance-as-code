# yaml-language-server: $schema=../schemas-generated/json-schemas/risk-model.schema.json
# Risk Assessment Model
# Defines the impact x likelihood scoring scale, resulting risk bands, and the
# IEC 62443-3-3 foundational-requirement categories a risk can be tagged with.

impact_levels:
  intolerable:
    value: 4
    color: "#8B0000"
  undesirable:
    value: 3
    color: "#DC143C"
  tolerable:
    value: 2
    color: "#FFA500"
  acceptable:
    value: 1
    color: "#90EE90"
  unscored:
    value: 0
    color: "#D3D3D3"

likelihood_levels:
  frequent:
    value: 4
  probable:
    value: 3
  possible:
    value: 2
  improbable:
    value: 1
  unscored:
    value: 0

# Risk score = impact value x likelihood value (range 1-16; 0 for unscored).
risk_levels:
  high:
    threshold: 12
    description: "Above the tolerable-risk line; implement controls immediately"
    color: "#8B0000"
    action: "Implement controls immediately"
  serious:
    threshold: 8
    description: "Above the tolerable-risk line; requires a deliberate treatment decision"
    color: "#DC143C"
    action: "Implement controls with urgency"
  medium:
    threshold: 4
    description: "At or below the tolerable-risk line"
    color: "#FFA500"
    action: "Implement controls in the standard cycle"
  low:
    threshold: 1
    description: "Acceptable risk"
    color: "#90EE90"
    action: "Review annually"
  unscored:
    threshold: 0
    description: "Risk not yet scored"
    color: "#D3D3D3"
    action: "Score the risk to determine treatment"

# IEC 62443-3-3 foundational requirements (FRs) a risk may be tagged with.
risk_categories:
  - id: "iac"
    name: "Identification and Authentication Control"
    description: "Risks related to identifying and authenticating users, devices, and software"
  - id: "uc"
    name: "Use Control"
    description: "Risks related to authorization, enforcement, and auditing of allowed actions"
  - id: "si"
    name: "System Integrity"
    description: "Risks related to tampering with or corrupting software, firmware, or data in transit"
  - id: "dc"
    name: "Data Confidentiality"
    description: "Risks related to unauthorized disclosure of data at rest or in transit"
  - id: "rdf"
    name: "Restricted Data Flow"
    description: "Risks related to network segmentation and unintended data flow between zones"
  - id: "tre"
    name: "Timely Response to Events"
    description: "Risks related to detecting, logging, and responding to security events"
  - id: "ra"
    name: "Resource Availability"
    description: "Risks related to denial of service and the availability of resources"
